[project]
name = "fundradar-worker"
version = "0.0.1"
description = "Fundradar worker for PEM ingestion and scraping"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.10.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pytesseract>=0.3.10",
    "PyMuPDF>=1.23.0",
    "Pillow>=10.0.0",
    "playwright>=1.40.0",
    "PyYAML>=6.0.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.0.0",
    "feedparser>=6.0.0",
    "deepl>=1.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.1.0",
]
ml = [
    "scikit-learn>=1.3.0",
    "numpy>=1.23.0",
    "scipy>=1.10.0",
    "joblib>=1.3.0",
]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "F821", "I001", "F401", "F841", "F541", "E402", "E722", "F601", "E741", "E713"]

[tool.pytest.ini_options]
testpaths = ["tests"]
