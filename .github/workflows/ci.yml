name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  new-fund-quality-gate:
    name: New Fund Completion Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run deterministic new-fund gate
        run: |
          BASE_REF=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            BASE_REF="${{ github.event.before }}"
          fi

          python3 scripts/check_new_fund_gate.py \
            --base-ref "$BASE_REF" \
            --head-ref "${{ github.sha }}"

  lint-and-test-ts:
    name: Lint & Test (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm -F @fundradar/shared build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  lint-and-test-python:
    name: Lint & Test (Python)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Test with pytest
        run: pytest -v
